name: fetch-jobs

# 每 3 小时自动抓一次海外线上岗位 → 提交 data/jobs.json → Vercel 自动重新部署
# 也可以在 GitHub 网页上手动触发（Run workflow 按钮）
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-jobs
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取岗位
        env:
          GITHUB_ACTIONS: "true"
        run: python scripts/fetch_jobs.py

      - name: 提交数据（有变化才提交）
        run: |
          git config user.name "jobs-bot"
          git config user.email "actions@github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "没有新岗位，跳过提交"
          else
            git commit -m "chore: 自动更新岗位数据 ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi

      # 私人数据（含联系方式+真实价）同步到站主的私有仓库。
      # 没配置 PRIVATE_REPO_URL 秘钥时自动跳过，不影响主流程。
      - name: 同步私人数据到私有仓库
        env:
          PRIVATE_REPO_URL: ${{ secrets.PRIVATE_REPO_URL }}
        if: ${{ env.PRIVATE_REPO_URL != '' }}
        run: |
          set -e
          TMP=$(mktemp -d)
          if git clone --depth 1 "$PRIVATE_REPO_URL" "$TMP/repo" 2>/dev/null; then
            echo "已连接私有仓库"
          else
            git init -b main "$TMP/repo"
            git -C "$TMP/repo" remote add origin "$PRIVATE_REPO_URL"
          fi
          cp data/jobs-private.json "$TMP/repo/jobs-private.json"
          cd "$TMP/repo"
          git config user.name "jobs-bot"
          git config user.email "actions@github.com"
          git add jobs-private.json
          if git diff --cached --quiet; then
            echo "私人数据无变化"
          else
            git commit -m "私人数据更新 ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push origin HEAD
          fi
