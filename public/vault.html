<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>资料库</title>
<style>
  :root{--bg:#0c0d10;--panel:#14161d;--line:#2a2c36;--gold:#ddc78c;--txt:#ece6d8;--dim:#9a958a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--gold)}
  .wrap{max-width:940px;margin:0 auto;padding:24px 16px 80px}
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 26px}
  .gate-card h1{margin:0 0 6px;font-size:19px;font-weight:600;letter-spacing:.04em;color:var(--gold)}
  .gate-card p{margin:0 0 22px;color:var(--dim);font-size:12px}
  input[type=password],input[type=text]{width:100%;padding:12px 14px;font-size:15px;border-radius:10px;border:1px solid var(--line);background:#0f1116;color:var(--txt);outline:none}
  input[type=password]:focus,input[type=text]:focus{border-color:var(--gold)}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px}
  .btn-main{width:100%;margin-top:14px;padding:12px;background:var(--gold);color:#17140d;font-weight:600;font-size:15px}
  .btn-main:disabled{opacity:.55;cursor:wait}
  .chk{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--dim);font-size:12px;cursor:pointer}
  .chk input{accent-color:var(--gold);width:15px;height:15px}
  .err{margin-top:12px;color:#ffb0a0;font-size:12px;min-height:18px;line-height:1.7}
  .showerr{padding:9px 11px;background:rgba(200,70,60,.14);border:1px solid rgba(224,138,122,.45);border-radius:8px}
  #app[hidden]{display:none}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .top h1{margin:0;font-size:19px;font-weight:600;color:var(--gold)}
  .stat{color:var(--dim);font-size:12px;margin-top:4px}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--dim);padding:7px 12px;font-size:12px}
  .bar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .views{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .view{flex:1 1 150px;background:#1b1e27;border:1px solid var(--line);color:var(--dim);padding:9px 10px;font-size:13px;text-align:center;border-radius:10px}
  .view b{font-size:15px;margin-left:5px;color:var(--dim)}
  .view.on{background:rgba(221,199,140,.14);border-color:var(--gold);color:var(--gold);font-weight:600}
  .view.on b{color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{background:#1b1e27;border:1px solid var(--line);color:var(--dim);padding:5px 11px;border-radius:999px;font-size:12px}
  .chip.on{background:rgba(221,199,140,.14);border-color:var(--gold);color:var(--gold)}
  .hint{font-size:12px;color:var(--dim);margin-top:9px}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:15px 16px;margin:10px 0}
  .card.direct{border-left:2px solid var(--gold)}
  .card .h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .id{font:600 12px ui-monospace,Consolas,monospace;color:var(--gold);background:rgba(221,199,140,.1);padding:2px 7px;border-radius:6px}
  .tt{font-size:15px;font-weight:600;color:#f5edd9}
  .badge{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(221,199,140,.16);color:var(--gold);border:1px solid rgba(221,199,140,.35)}
  .badge.dm{background:#1b1e27;color:var(--dim);border-color:var(--line)}
  .ot{font-size:12px;color:var(--dim);margin-top:3px;word-break:break-word}
  .meta{font-size:12px;color:var(--dim);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .money{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  .pill{font-size:12px;padding:4px 10px;border-radius:8px;background:#1b1e27;border:1px solid var(--line);color:var(--dim)}
  .pill.hot{background:rgba(221,199,140,.12);border-color:rgba(221,199,140,.4);color:var(--gold);font-weight:600}
  .contact{margin-top:11px;padding:11px 13px;background:#101820;border-left:2px solid var(--gold);border-radius:0 8px 8px 0;font-size:13.5px;word-break:break-word;line-height:1.9}
  .contact .lb,.desc .lb{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;letter-spacing:.05em}
  .url{margin-top:9px;font-size:12px;word-break:break-all}
  .desc{margin-top:11px;white-space:pre-wrap;word-break:break-word;font-size:12.5px;color:#b8b2a5;max-height:190px;overflow:auto;padding-right:6px}
  mark{background:rgba(221,199,140,.22);color:#ffe9b0;padding:1px 3px;border-radius:3px}
  .row{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .btn-sm{background:#1b1e27;border:1px solid var(--line);color:var(--txt);padding:6px 11px;font-size:12px}
  .empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
  .cnt{color:var(--dim);font-size:12px;margin:14px 2px}
  .more{display:block;width:100%;margin:14px 0;padding:11px;background:#1b1e27;border:1px solid var(--line);color:var(--gold);font-size:13px}
  @media(max-width:520px){.wrap{padding:16px 12px 60px}.gate-card{padding:26px 20px}.card{padding:13px}.view{flex:1 1 44%}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>资料库</h1>
    <p>请输入访问密码。内容在本机解密，不上传、不留痕。</p>
    <input id="pw" type="password" placeholder="访问密码" autocomplete="current-password" autofocus>
    <label class="chk"><input id="remember" type="checkbox" checked> 在这台设备上记住</label>
    <button class="btn-main" id="go">解锁</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>资料库</h1>
        <div class="stat" id="stat">读取中…</div>
      </div>
      <button class="btn-ghost" id="lock">锁定 / 清除记住</button>
    </div>

    <div class="bar">
      <div class="views" id="views"></div>
      <input id="q" type="text" placeholder="搜岗位编号、标题、联系方式、来源…（留空就是浏览）">
      <div class="chips" id="chips"></div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="cnt" id="cnt"></div>
    <div id="list"></div>
    <button class="more" id="more" hidden>显示更多</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const ITER = 310000;
  const CATS = ["tech","web3","support","design","marketing","writing","data","misc"];
  const CAT_ZH = {tech:"技术开发",web3:"币圈 / Web3",support:"客服 / 助理",design:"设计 / 影音",marketing:"运营 / 推广",writing:"写作 / 翻译",data:"数据 / 录入",misc:"其他"};
  const VIEWS = [
    ["direct","可直接联系"], ["dm","站内私信"],
    ["platform","原帖 / 平台"], ["all","全部岗位"]
  ];
  let ALL = [], CAT = "all", VIEW = "direct", LIMIT = 40, UPDATED = "";

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function b64(s){
    const bin = atob(s), a = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
    return a;
  }
  function pemToDer(pem){ return b64(pem.replace(/-----[^-]+-----/g,"").replace(/\s+/g,"")); }
  function fmt(t){ try{ return new Date(t).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return String(t||""); } }

  // 把联系方式/链接/电话/@账号高亮（先算区间再去重，避免标签套标签）
  function hl(text){
    const s = String(text==null?"":text), ranges = [];
    const pats = [
      /https?:\/\/[^\s<>"']+/gi,
      /(?:t|chat)\.me\/[^\s<>"']+/gi,
      /wa\.me\/[^\s<>"']+/gi,
      /[\w.+-]+@[\w-]+\.[\w.-]+\.[A-Za-z]{2,}/g,
      /@[A-Za-z0-9_]{3,31}\b/g,
      /\+?\d[\d\s\-().]{6,16}\d/g
    ];
    for(const re of pats){ let m; while((m=re.exec(s))!==null){ ranges.push([m.index,m.index+m[0].length]); if(m[0].length===0) re.lastIndex++; } }
    ranges.sort((a,b)=>a[0]-b[0]);
    const merged=[];
    for(const r of ranges){ const last=merged[merged.length-1]; if(last && r[0]<=last[1]) last[1]=Math.max(last[1],r[1]); else merged.push(r.slice()); }
    let out="", pos=0;
    for(const [a,b] of merged){ out += esc(s.slice(pos,a)) + "<mark>" + esc(s.slice(a,b)) + "</mark>"; pos=b; }
    return out + esc(s.slice(pos));
  }

  // 密码 → 解开被锁住的私钥
  async function unlockKey(pw){
    const res = await fetch("./vault.key?_=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("密钥文件读取失败");
    const wk = (await res.text()).trim().split(".");
    if(wk.length!==4 || wk[0]!=="v1") throw new Error("密钥文件不支持，请重新同步");
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const kek = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(wk[1]), iterations:ITER, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]
    );
    const privPem = new TextDecoder().decode(
      await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(wk[2])}, kek, b64(wk[3]))
    );
    return crypto.subtle.importKey(
      "pkcs8", pemToDer(privPem), {name:"RSA-OAEP", hash:"SHA-256"}, false, ["decrypt"]
    );
  }

  async function decryptFile(name, privKey, required){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), required ? 30000 : 60000);
    let res;
    try{
      res = await fetch("./"+name+"?_="+Date.now(), {cache:"no-store", signal:ctl.signal});
    }catch(e){
      clearTimeout(timer);
      if(required) throw new Error("网络超时，没读到 "+name+"。请检查网络或代理后重试");
      return null;
    }
    clearTimeout(timer);
    if(!res.ok){
      if(required) throw new Error("读取 "+name+" 失败（HTTP "+res.status+"），请重试");
      return null;
    }
    const p = (await res.text()).trim().split(".");
    if(p.length!==4 || p[0]!=="v2"){
      if(required) throw new Error(name+" 格式不对，请重新同步数据");
      return null;
    }
    const dk = await crypto.subtle.decrypt({name:"RSA-OAEP"}, privKey, b64(p[1]));
    const key = await crypto.subtle.importKey("raw", dk, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p[2])}, key, b64(p[3]));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  // 首屏只读「可直接联系」那份小文件（约 180KB），弱网几秒就能进来
  async function loadFirst(pw, onStep){
    const privKey = await unlockKey(pw);
    onStep("正在读取首屏岗位（较小的文件）…");
    const first = await decryptFile("vault.contacts.bin", privKey, true);
    if(!first || !first.jobs || !first.jobs.length) throw new Error("首屏档案是空的，请重新同步数据");
    return {privKey, first};
  }

  // 首屏出来后，后台再把站内私信和全部岗位补齐（文件较大，失败也不影响首屏）
  async function loadRest(privKey, first, onStep){
    onStep("正在后台补充其余岗位…");
    const [extra, main] = await Promise.all([
      decryptFile("vault.extra.bin", privKey, false).catch(()=>null),
      decryptFile("vault.bin", privKey, false).catch(()=>null)
    ]);
    if(!extra && !main) return false;
    const map = new Map();
    for(const j of ((main&&main.jobs)||[])) map.set(j.id, j);
    for(const j of ((extra&&extra.jobs)||[])) map.set(j.id, j);
    for(const j of (first.jobs||[])) map.set(j.id, j); // 首屏那份联系方式最全，优先
    ALL = Array.from(map.values()).sort((a,b)=>String(b.published||"").localeCompare(String(a.published||"")));
    UPDATED = UPDATED || (main&&main.updated) || first.updated;
    return true;
  }

  function kindOf(j){
    const k = j.contact_kind || (j.contact && j.contact.trim() ? "direct" : (j.url ? "link" : ""));
    return k;
  }
  function matchView(j){
    const k = kindOf(j);
    if(VIEW==="direct") return k==="direct";
    if(VIEW==="dm") return k==="dm";
    if(VIEW==="platform") return k==="link"||k==="platform"||k===""||k==="none";
    return true;
  }
  function countView(v){
    const old = VIEW; VIEW = v;
    const n = ALL.filter(matchView).length;
    VIEW = old; return n;
  }

  function open(d, pw){
    ALL = d.jobs || [];
    UPDATED = d.updated || "";
    $("#gate").hidden = true; $("#app").hidden = false;
    const nd = countView("direct");
    $("#stat").textContent = "共 " + ALL.length + " 条 · 其中可直接联系 " + nd + " 条 · 更新于 " + fmt(d.updated);
    if(pw && $("#remember").checked){ try{ localStorage.setItem("vault_pw", pw); }catch(e){} }
    buildViews(); buildChips(); render();
  }

  function buildViews(){
    $("#views").innerHTML = VIEWS.map(([k,label]) =>
      '<button class="view'+(VIEW===k?" on":"")+'" data-v="'+k+'">'+esc(label)+'<b>'+countView(k)+'</b></button>'
    ).join("");
    $("#views").querySelectorAll(".view").forEach(b=>b.addEventListener("click",()=>{
      VIEW=b.dataset.v; LIMIT=40; buildViews(); render();
    }));
  }

  function buildChips(){
    $("#chips").innerHTML = [["all","全部分类"], ...CATS.map(c=>[c,CAT_ZH[c]])].map(([k,label]) =>
      '<button class="chip'+(CAT===k?" on":"")+'" data-k="'+k+'">'+esc(label)+'</button>'
    ).join("");
    $("#chips").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
      CAT=b.dataset.k; LIMIT=40; buildChips(); render();
    }));
    $("#hint").textContent = VIEW==="direct"
      ? "这些岗位留了微信 / Telegram / 邮箱 / WhatsApp，可以直接联系雇主。"
      : (VIEW==="dm" ? "这些只能走站内私信联系发帖人。" :
         (VIEW==="platform" ? "这些要去原帖或招聘平台里联系。" : "全部岗位，包含以上各类。"));
  }

  function render(){
    const kw = $("#q").value.trim().toLowerCase();
    let hits = ALL.filter(j=>{
      if(!matchView(j)) return false;
      if(CAT!=="all" && j.cat!==CAT) return false;
      if(!kw) return true;
      return [j.id,j.title,j.title_zh,j.desc,j.source,j.cat,j.contact,j.url].join(" ").toLowerCase().includes(kw);
    });
    const total = hits.length;
    const shown = hits.slice(0, LIMIT);
    $("#cnt").textContent = "共 " + total + " 条" + (kw ? " 匹配" : "") + (total>LIMIT ? "，已显示前 "+shown.length+" 条" : "");
    $("#list").innerHTML = shown.map(card).join("") ||
      '<div class="empty">'+(kw ? "没查到，换个关键词试试，或切到「全部岗位」。" : "这一组暂时没有岗位，切到「全部岗位」看看。")+'</div>';
    $("#more").hidden = total <= LIMIT;
    $("#more").textContent = "显示更多（还有 " + (total-shown.length) + " 条）";
    $("#list").querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
      const t=b.dataset.copy;
      navigator.clipboard.writeText(t).then(()=>{b.textContent="已复制";setTimeout(()=>b.textContent=b.dataset.label||"复制",1500)})
        .catch(()=>{b.textContent="复制失败，请长按选中"});
    }));
  }

  function card(j){
    const title = j.title_zh || j.title || "(无标题)";
    const orig = (j.title_zh && j.title && j.title_zh!==j.title) ? '<div class="ot">原标题：'+esc(j.title)+'</div>' : "";
    const k = kindOf(j);
    const contact = (j.contact || "").trim();
    const label = j.contact_label || (k==="direct" ? "可直接联系" : (k==="link" ? "原帖链接" : ""));
    const badge = label ? '<span class="badge'+(k==="direct"?"":" dm")+'">'+esc(label)+'</span>' : "";
    const copyText = contact || j.url || j.desc || "";
    return '<div class="card'+(k==="direct"?" direct":"")+'">'+
      '<div class="h"><span class="id">#'+esc(j.id)+'</span><span class="tt">'+esc(title)+'</span>'+badge+'</div>'+ orig +
      '<div class="meta"><span>'+esc(CAT_ZH[j.cat]||j.cat||"")+'</span><span>'+esc(j.source||"")+'</span><span>'+esc(fmt(j.published))+'</span></div>'+
      '<div class="money">'+
        (j.salary?'<span class="pill">原始金额 '+esc(j.salary)+'</span>':'')+
        (j.quote?'<span class="pill hot">展示价 '+esc(j.quote)+'</span>':'')+
        (!j.salary&&!j.quote?'<span class="pill">薪资面议</span>':'')+
      '</div>'+
      (contact?'<div class="contact"><span class="lb">联系方式</span>'+hl(contact)+'</div>':'')+
      (j.url?'<div class="url">原帖：<a href="'+esc(j.url)+'" target="_blank" rel="noopener noreferrer">'+esc(j.url)+'</a></div>':'')+
      (j.desc?'<div class="desc"><span class="lb">原始信息</span>'+hl(j.desc)+'</div>':'')+
      '<div class="row">'+
        '<button class="btn-sm" data-copy="'+esc(copyText)+'" data-label="复制联系方式">复制联系方式</button>'+
        '<button class="btn-sm" data-copy="'+esc(j.id)+'" data-label="复制岗位编号">复制岗位编号</button>'+
      '</div>'+
    '</div>';
  }

  async function tryUnlock(pw, manual){
    const btn=$("#go"), err=$("#err");
    if(!pw){ err.textContent="请输入访问密码"; err.className="err showerr"; return; }
    btn.disabled=true; err.textContent=""; err.className="err";
    if(manual) btn.textContent="正在验证密码…";
    try{
      const {privKey, first} = await loadFirst(pw, msg=>{ if(manual) btn.textContent=msg; });
      open({updated: first.updated, jobs: first.jobs}, manual ? pw : null);
      btn.disabled=false; btn.textContent="解锁";
      // 首屏已可用，剩下的大文件后台慢慢补，失败也不影响看岗位
      loadRest(privKey, first, msg=>{
        $("#stat").textContent = "首屏就绪 · " + msg;
      }).then(ok=>{
        $("#stat").textContent = "共 " + ALL.length + " 条 · 可直接联系 " + countView("direct") +
          " 条 · 更新于 " + fmt(UPDATED) + (ok ? "" : "（其余岗位暂未加载到）");
        buildViews(); render();
      });
    }catch(e){
      const msg = (e && e.name==="OperationError") ? "密码不对，或数据已更新但密码变了" : ("打不开：" + (e&&e.message||e));
      if(manual){
        err.textContent = msg; err.className="err showerr";
        btn.textContent="解锁"; btn.disabled=false;
      }else{
        try{ localStorage.removeItem("vault_pw"); }catch(_){}
        $("#gate").hidden=false;
        btn.disabled=false; btn.textContent="解锁";
        $("#pw").value="";
        err.textContent = msg; err.className="err showerr";
      }
    }
  }

  $("#go").addEventListener("click",()=>tryUnlock($("#pw").value.trim(),true));
  $("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock($("#pw").value.trim(),true); });
  $("#q").addEventListener("input",()=>{ LIMIT=40; render(); });
  $("#more").addEventListener("click",()=>{ LIMIT+=40; render(); });
  $("#lock").addEventListener("click",()=>{
    try{ localStorage.removeItem("vault_pw"); }catch(e){}
    location.reload();
  });

  let saved="";
  try{ saved = localStorage.getItem("vault_pw")||""; }catch(e){}
  if(saved){ $("#pw").value=saved; tryUnlock(saved,false); }
})();
</script>
</body>
</html>
