<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>远程岗位精选 · 锦市 Jobs</title>
<style>
  :root{--bg:#0c0d10;--panel:#14161d;--line:#2a2c36;--gold:#ddc78c;--txt:#ece6d8;--dim:#9a958a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px}
  a{color:var(--gold)}
  .wrap{max-width:900px;margin:0 auto;padding:36px 16px 110px}
  .head h1{margin:0 0 8px;font:600 27px/1.3 "Cormorant Garamond",Georgia,serif;color:var(--gold);letter-spacing:.02em}
  .head p{margin:0;color:var(--dim);font-size:13px;max-width:640px}
  .head .stat{margin-top:10px;font-size:12px;color:#8e897e}
  .apply{margin:20px 0 26px;padding:18px 20px;background:linear-gradient(135deg,rgba(221,199,140,.10),rgba(221,199,140,.02));border:1px solid rgba(221,199,140,.28);border-radius:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .apply .txt{flex:1;min-width:220px}
  .apply .txt b{display:block;color:var(--gold);font-size:15px;font-weight:600}
  .apply .txt span{font-size:12px;color:var(--dim)}
  .apply .wx{font:600 17px ui-monospace,Consolas,monospace;color:var(--gold);letter-spacing:.03em}
  .btn{background:var(--gold);color:#17140d;font-weight:600;font-size:13px;padding:11px 18px;white-space:nowrap}
  .btn:active{opacity:.8}
  .bar{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:16px}
  input[type=text]{width:100%;padding:11px 13px;font-size:14px;border-radius:9px;border:1px solid var(--line);background:#0f1116;color:var(--txt);outline:none}
  input[type=text]:focus{border-color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .chip{background:#1b1e27;border:1px solid var(--line);color:var(--dim);padding:5px 11px;border-radius:999px;font-size:12px}
  .chip.on{background:rgba(221,199,140,.14);border-color:var(--gold);color:var(--gold)}
  .cnt{color:var(--dim);font-size:12px;margin:14px 2px}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:15px 16px;margin:10px 0}
  .card .h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .id{font:600 11px ui-monospace,Consolas,monospace;color:var(--gold);background:rgba(221,199,140,.1);padding:2px 7px;border-radius:5px}
  .tt{font-size:15px;font-weight:600;color:#f5edd9;line-height:1.45}
  .meta{font-size:12px;color:var(--dim);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .sal{color:var(--gold);font-weight:600}
  .foot{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
  .foot b{color:var(--gold);font-weight:600}
  .mini{background:#1b1e27;border:1px solid var(--line);color:var(--gold);padding:5px 11px;font-size:11px}
  .more{display:block;width:100%;margin:16px 0;padding:11px;background:#1b1e27;border:1px solid var(--line);color:var(--gold);font-size:13px}
  .empty{color:var(--dim);text-align:center;padding:44px 0;font-size:13px}
  .dock{position:fixed;left:0;right:0;bottom:0;background:rgba(12,13,16,.96);border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:12px;align-items:center;justify-content:center;z-index:9;backdrop-filter:blur(8px)}
  .dock span{font-size:12px;color:var(--dim)}
  .dock b{color:var(--gold);font:600 15px ui-monospace,Consolas,monospace}
  @media(max-width:520px){.wrap{padding:24px 12px 100px}.head h1{font-size:23px}.apply{padding:15px}.card{padding:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>远程岗位精选</h1>
    <p>以下为当前在招的海外线上岗位。想了解岗位详情、确认是否还在招，或要顾问帮忙对接，请加微信 <strong style="color:var(--gold)">SiwSong-CD</strong>，备注岗位编号。</p>
    <div class="stat" id="stat">正在加载岗位…</div>
  </div>

  <div class="apply">
    <div class="txt">
      <b>加顾问微信，快速定位岗位</b>
      <span>复制微信号 → 微信添加 → 发岗位编号。顾问核对在招状态后为你安排对接。</span>
    </div>
    <div class="wx">SiwSong-CD</div>
    <button class="btn" id="copyTop">复制微信号</button>
  </div>

  <div class="bar">
    <input type="text" id="q" placeholder="搜岗位编号、标题关键词…">
    <div class="chips" id="chips"></div>
  </div>

  <div class="cnt" id="cnt"></div>
  <div id="list"></div>
  <button class="more" id="more" hidden>显示更多</button>
</div>

<div class="dock">
  <span>顾问微信</span><b>SiwSong-CD</b><button class="btn" id="copyDock">复制</button>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const WX = "SiwSong-CD";
  const CATS = ["tech","web3","support","design","marketing","writing","data","misc"];
  const CAT_ZH = {tech:"技术开发",web3:"币圈 / Web3",support:"客服 / 助理",design:"设计 / 影音",marketing:"运营 / 推广",writing:"写作 / 翻译",data:"数据 / 录入",misc:"其他"};
  let ALL = [], CAT = "all", LIMIT = 30;

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function fmt(t){ try{ return new Date(t).toLocaleDateString("zh-CN",{month:"2-digit",day:"2-digit"}); }catch(e){ return ""; } }
  function copy(btn){
    navigator.clipboard.writeText(WX)
      .then(()=>{ const old=btn.textContent; btn.textContent="已复制"; setTimeout(()=>btn.textContent=old,1600); })
      .catch(()=>{ btn.textContent="请长按选择复制"; });
  }
  $("#copyTop").addEventListener("click",()=>copy($("#copyTop")));
  $("#copyDock").addEventListener("click",()=>copy($("#copyDock")));

  function chips(){
    $("#chips").innerHTML = [["all","全部岗位"], ...CATS.map(c=>[c,CAT_ZH[c]])].map(([k,label])=>
      '<button class="chip'+(CAT===k?" on":"")+'" data-k="'+k+'">'+esc(label)+'</button>').join("");
    $("#chips").querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
      CAT=b.dataset.k; LIMIT=30; chips(); render();
    }));
  }

  function render(){
    const kw = $("#q").value.trim().toLowerCase();
    const hits = ALL.filter(j=>{
      if(CAT!=="all" && j.cat!==CAT) return false;
      if(!kw) return true;
      return (j.id+" "+j.title).toLowerCase().includes(kw);
    });
    $("#cnt").textContent = "共 "+hits.length+" 个岗位"+(kw?" 匹配":"");
    const shown = hits.slice(0,LIMIT);
    $("#list").innerHTML = shown.map(j=>
      '<div class="card"><div class="h"><span class="id">#'+esc(j.id)+'</span><span class="tt">'+esc(j.title)+'</span></div>'+
      '<div class="meta"><span>'+esc(CAT_ZH[j.cat]||j.cat||"")+'</span>'+
      (j.salary?'<span class="sal">'+esc(j.salary)+'</span>':'<span>薪资面议</span>')+
      '<span>'+esc(fmt(j.published))+'</span></div>'+
      '<div class="foot"><span>想了解详情？加微信 <b>'+WX+'</b>，备注编号 <b>'+esc(j.id)+'</b></span>'+
      '<button class="mini" data-id="'+esc(j.id)+'">复制编号</button></div></div>'
    ).join("") || '<div class="empty">没找到匹配的岗位，换个关键词试试。</div>';
    $("#more").hidden = hits.length<=LIMIT;
    $("#more").textContent = "显示更多（还有 "+(hits.length-shown.length)+" 个）";
    $("#list").querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>{
      navigator.clipboard.writeText(b.dataset.id)
        .then(()=>{ b.textContent="已复制"; setTimeout(()=>b.textContent="复制编号",1500); })
        .catch(()=>{ b.textContent="复制失败"; });
    }));
  }

  $("#q").addEventListener("input",()=>{ LIMIT=30; render(); });
  $("#more").addEventListener("click",()=>{ LIMIT+=30; render(); });

  fetch("./share-jobs.json?_="+Date.now(),{cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(d=>{
      ALL = d.jobs || [];
      $("#stat").textContent = "共 "+ALL.length+" 个在招岗位 · 更新于 "+fmt(d.updated);
      chips(); render();
    })
    .catch(e=>{ $("#stat").textContent = "岗位加载失败："+e.message+"（请刷新重试）"; });
})();
</script>
</body>
</html>
